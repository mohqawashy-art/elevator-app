<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiftCore — تسجيل الدخول</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% include 'partials/liftcore_head.html' %}
<link rel="stylesheet" href="{{ url_for('static', filename='liftcore-layout.css') }}">
</head>
<body>

  <div class="page-wrap">
    <div class="card">

      <!-- الشعار -->
      <div class="logo-area">
  <img src="{{ brand_logo_url }}" alt="{{ brand_name }}" class="logo-img login-logo">
</div>

      <!-- رسالة الخطأ -->
      {% if error %}
      <div class="error-msg">
        {{ error }}
      </div>
      {% endif %}

      <!-- النموذج -->
      <form method="POST" action="{{ url_for('login') }}">
        <div class="field">
          <label for="email">البريد الإلكتروني أو اسم المستخدم</label>
          <input type="text" id="email" name="email" placeholder="admin@liftcore.sa" required>
        </div>

        <div class="field">
          <label for="password">كلمة المرور</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>

        <div class="forgot-row">
          <a href="#" class="forgot-link">نسيت كلمة المرور؟</a>
        </div>

        <button type="submit" class="btn-submit">دخول</button>
      </form>

    </div>
  </div>

</body>
</html>
