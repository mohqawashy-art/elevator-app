<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
{% include 'partials/liftcore_boot.html' %}
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#131b27">
<title>{{ file_name }} — LiftCore</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:Arial,'IBM Plex Sans Arabic',Tahoma,sans-serif;background:#111722;color:#e7edf8}
.lc-upload-view-toolbar{
  position:fixed;top:0;left:0;right:0;z-index:99;display:flex;align-items:center;
  justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px;
  background:#131b27;border-bottom:1px solid rgba(100,160,255,.12);
}
.lc-upload-view-title{
  font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  max-width:min(70vw,720px);
}
.lc-upload-view-actions{display:flex;gap:8px;flex-wrap:wrap}
.lc-upload-view-actions a{
  display:inline-flex;align-items:center;justify-content:center;border-radius:8px;
  padding:8px 16px;font-size:13px;font-weight:600;text-decoration:none;cursor:pointer;
}
.lc-upload-view-download{background:#2a3548;color:#e7edf8;border:1px solid rgba(100,160,255,.18)}
.lc-upload-view-close{background:#3b82f6;color:#fff;border:1px solid transparent}
.lc-upload-view-body{
  position:fixed;top:52px;left:0;right:0;bottom:0;background:#111722;
}
.lc-upload-view-frame,.lc-upload-view-img{width:100%;height:100%;border:0;background:#fff}
.lc-upload-view-img{object-fit:contain;background:#111722;display:block}
@media(max-width:700px){
  .lc-upload-view-toolbar{padding:10px 12px}
  .lc-upload-view-body{top:48px}
}
</style>
</head>
<body>
<div class="lc-upload-view-toolbar">
  <div class="lc-upload-view-title">{{ file_name }}</div>
  <div class="lc-upload-view-actions">
    <a class="lc-upload-view-download" href="{{ file_url }}" download="{{ file_name }}">تنزيل</a>
    <a class="lc-upload-view-close" href="{{ return_url }}" id="lc-upload-view-close">إغلاق</a>
  </div>
</div>
<div class="lc-upload-view-body">
  {% if is_image %}
  <img class="lc-upload-view-img" src="{{ file_url }}" alt="{{ file_name }}">
  {% else %}
  <iframe class="lc-upload-view-frame" src="{{ file_url }}" title="{{ file_name }}"></iframe>
  {% endif %}
</div>
<script>
(function () {
  var closeEl = document.getElementById('lc-upload-view-close');
  if (!closeEl) return;
  closeEl.addEventListener('click', function (e) {
    if (window.history.length > 1) {
      e.preventDefault();
      window.history.back();
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (window.history.length > 1) window.history.back();
      else window.location.href = closeEl.getAttribute('href') || '/home';
    }
  });
})();
</script>
</body>
</html>
