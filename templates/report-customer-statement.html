<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LiftCore — كشف حساب عميل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0f17;--bg2:#111720;--bg3:#161e2b;--card:#131b27;--border:rgba(100,160,255,.1);
  --accent:#2a7fff;--text1:#e4eaf5;--text2:#8a9bb8;--text3:#4a5a72;
  --success:#1fb87a;--warning:#e09030;--danger:#e04848;
  --font-ar:'IBM Plex Sans Arabic',sans-serif;--r:10px;--r-sm:7px;
}
html[dir="rtl"]{font-family:var(--font-ar)}
body{background:var(--bg);color:var(--text1);min-height:100vh;display:flex;overflow-x:hidden}
.sidebar{width:240px;min-width:240px;background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;height:100vh;position:sticky;top:0;z-index:100;overflow:hidden}
.sidebar-logo{padding:10px 16px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--border);min-height:60px}
.sidebar-logo img{width:150px;height:44px;object-fit:contain}
.sidebar-nav{flex:1;overflow-y:auto;padding:10px 0}
.sidebar-nav::-webkit-scrollbar{width:3px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 16px;margin:1px 8px;border-radius:var(--r-sm);cursor:pointer;font-size:13px;color:var(--text2);text-decoration:none}
.nav-item:hover{background:var(--bg3);color:var(--text1)}
.nav-item.active{background:rgba(42,127,255,.12);color:var(--accent)}
.nav-item svg{width:16px!important;height:16px!important;flex-shrink:0;opacity:.8;max-width:16px;max-height:16px}
.nav-group{margin:2px 0}
.nav-group-btn{display:flex;align-items:center;justify-content:space-between;width:calc(100% - 16px);margin:1px 8px;padding:9px 12px;border:none;border-radius:var(--r-sm);background:transparent;color:var(--text2);font:inherit;cursor:pointer;text-align:right}
.nav-group-btn:hover{background:var(--bg3);color:var(--text1)}
.nav-group-label{font-size:13px;font-weight:500}
.nav-group-chevron{opacity:.6;flex-shrink:0}
.nav-group-menu{display:none;padding:2px 0 6px}
.nav-group[data-open] .nav-group-menu,.nav-group-btn[aria-expanded="true"] + .nav-group-menu{display:block}
.nav-group-menu .nav-item{padding-right:28px;font-size:12.5px}
.nav-menu-section{padding:10px 16px 4px;font-size:10px;color:var(--text3);letter-spacing:.06em}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.content{flex:1;padding:24px;overflow-y:auto}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:var(--r-sm);font-size:13px;font-weight:500;cursor:pointer;border:none;font-family:var(--font-ar);text-decoration:none;color:inherit}
.btn-primary{background:var(--accent);color:#fff}
.btn-secondary{background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
.btn-sm{padding:6px 12px;font-size:12px}
.stmt-filters{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px 20px;margin-bottom:20px}
.stmt-filters .row{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:end}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:500;color:var(--text2)}
.field select{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--text1);font-size:13px;padding:9px 12px;width:100%;font-family:inherit}
.stmt-empty{text-align:center;padding:48px 20px;color:var(--text3);background:var(--card);border:1px dashed var(--border);border-radius:var(--r)}
.stmt-empty h2{color:var(--text1);font-size:16px;margin:12px 0 6px}
.print-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.print-toolbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--bg2);gap:8px;flex-wrap:wrap}
#report-page{background:#fff;color:#111;padding:28px 32px;font-family:var(--font-ar);min-height:200px}
.rpt-header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:3px solid #1a4fa0;padding-bottom:14px;margin-bottom:18px}
.rpt-header h1{font-size:18px;color:#1a4fa0;margin:0 0 4px}
.rpt-header h2{font-size:12px;color:#666;font-weight:400;margin:0}
.rpt-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;margin-bottom:16px;font-size:13px}
.rpt-meta .k{color:#666;font-size:11px}
.rpt-meta .v{font-weight:600;color:#111}
.rpt-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.rpt-kpi{border:1px solid #e5e9f0;border-radius:8px;padding:12px;text-align:center}
.rpt-kpi .l{font-size:11px;color:#666;margin-bottom:4px}
.rpt-kpi .n{font-size:18px;font-weight:700}
.rpt-kpi.due .n{color:#c0392b}
.rpt-kpi.paid .n{color:#1a7f4b}
table.stmt-tbl{width:100%;border-collapse:collapse;font-size:12.5px}
table.stmt-tbl th{background:#f3f6fb;color:#334;text-align:right;padding:8px 10px;border-bottom:2px solid #d8e0ec;font-weight:600}
table.stmt-tbl td{padding:8px 10px;border-bottom:1px solid #eef1f6;vertical-align:top}
table.stmt-tbl .num{font-variant-numeric:tabular-nums;direction:ltr;text-align:left;white-space:nowrap}
table.stmt-tbl tfoot td{font-weight:700;background:#f8fafc;border-top:2px solid #d8e0ec}
.rpt-foot{margin-top:18px;font-size:11px;color:#777;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.mobile-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:95}
@media(max-width:768px){
  .sidebar{position:fixed;right:-240px;transition:right .25s}
  .sidebar.open{right:0}
  .mobile-overlay.open{display:block}
  .stmt-filters .row{grid-template-columns:1fr}
  .rpt-kpis{grid-template-columns:1fr 1fr}
}
@media print{
  body *{visibility:hidden}
  #report-page,#report-page *{visibility:visible}
  #report-page{position:absolute;inset:0;width:100%;padding:12mm}
  .sidebar,.stmt-filters,.print-toolbar,.page-head,.mobile-overlay{display:none!important}
}
</style>
</head>
<body>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo"><img src="{{ brand_logo_url }}" alt="LiftCore"></div>
  <nav class="sidebar-nav">{% include 'partials/app_sidebar_nav.html' %}</nav>
</aside>
<div class="mobile-overlay" id="overlay" onclick="closeSidebar()"></div>
<div class="main">
  <div class="content">
    <div class="page-head" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px">
      <div>
        <div style="font-size:18px;font-weight:600">كشف حساب عميل</div>
        <div style="font-size:13px;color:var(--text3);margin-top:4px">مدين (عقود/فواتير) · دائن (تحصيلات) · الرصيد المستحق</div>
      </div>
      <a class="btn btn-secondary btn-sm" href="/reports">كل التقارير</a>
    </div>

    <div class="stmt-filters screen-only">
      <div class="row">
        <div class="field">
          <label>اختر العميل</label>
          <select id="sel-client">
            <option value="">— اختر العميل —</option>
            {% for c in customers %}
            <option value="{{ c.id }}" {% if selected_id == c.id %}selected{% endif %}>{{ c.code }} — {{ c.name }}</option>
            {% endfor %}
          </select>
        </div>
        <button type="button" class="btn btn-primary" onclick="loadStatement()" style="height:38px">عرض الكشف</button>
        <button type="button" class="btn btn-secondary" onclick="window.print()" id="btn-print" style="height:38px;display:none">طباعة</button>
      </div>
    </div>

    <div id="stmt-empty" class="stmt-empty" {% if selected_id %}style="display:none"{% endif %}>
      <div style="font-size:36px;opacity:.5">📋</div>
      <h2>كشف حساب العميل</h2>
      <p>اختر العميل ثم اضغط «عرض الكشف» لرؤية العقود/الفواتير والمدفوعات والرصيد المستحق.</p>
    </div>

    <div class="print-wrap" id="stmt-wrap" style="display:none">
      <div class="print-toolbar screen-only">
        <span id="toolbar-title" style="font-size:13px;color:var(--text2)">كشف الحساب</span>
        <div style="display:flex;gap:8px">
          <button type="button" class="btn btn-secondary btn-sm" onclick="window.print()">طباعة</button>
          <a class="btn btn-primary btn-sm" id="link-revenues" href="/revenues">تسجيل تحصيل</a>
        </div>
      </div>
      <div id="report-page"></div>
    </div>
  </div>
</div>

<script>
const COMPANY = {{ company_json|tojson }};
const PRESELECT = {{ selected_id|tojson }};

function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('open');}

document.addEventListener('click', function (e) {
  var btn = e.target.closest('.nav-group-btn');
  if (!btn) return;
  var group = btn.closest('.nav-group');
  if (!group) return;
  var open = btn.getAttribute('aria-expanded') === 'true';
  document.querySelectorAll('.nav-group-btn[aria-expanded="true"]').forEach(function (b) {
    if (b !== btn) b.setAttribute('aria-expanded', 'false');
  });
  btn.setAttribute('aria-expanded', open ? 'false' : 'true');
});

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function money(n) {
  return Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtDate(s) {
  if (!s) return '—';
  const p = String(s).slice(0, 10).split('-');
  if (p.length !== 3) return esc(s);
  return p[2] + '/' + p[1] + '/' + p[0];
}

function renderStatement(data) {
  const lines = data.lines || [];
  let rows = '';
  if (!lines.length) {
    rows = '<tr><td colspan="6" style="text-align:center;color:#888;padding:24px">لا توجد حركات لهذا العميل</td></tr>';
  } else {
    lines.forEach(function (r) {
      rows += '<tr>' +
        '<td>' + fmtDate(r.date) + '</td>' +
        '<td>' + esc(r.type) + '</td>' +
        '<td><strong>' + esc(r.code) + '</strong><div style="color:#666;font-size:11px;margin-top:2px">' + esc(r.description || '') + '</div></td>' +
        '<td class="num">' + (r.debit ? money(r.debit) : '—') + '</td>' +
        '<td class="num">' + (r.credit ? money(r.credit) : '—') + '</td>' +
        '<td class="num"><strong>' + money(r.balance) + '</strong></td>' +
      '</tr>';
    });
  }

  const due = Number(data.balance_due || 0);
  document.getElementById('report-page').innerHTML =
    '<div class="rpt-header">' +
      '<div>' +
        '<h1>كشف حساب عميل</h1>' +
        '<h2>Customer Account Statement</h2>' +
        '<div style="margin-top:8px;font-size:12px;color:#555">' + esc(COMPANY.name || 'LiftCore') +
          (COMPANY.vat ? ' · ضريبة: ' + esc(COMPANY.vat) : '') +
        '</div>' +
      '</div>' +
      '<div style="text-align:left">' +
        (COMPANY.logo ? '<img src="' + esc(COMPANY.logo) + '" alt="" style="height:48px;object-fit:contain">' : '') +
        '<div style="font-size:11px;color:#777;margin-top:4px">تاريخ الإصدار: ' + fmtDate(data.generated_at) + '</div>' +
      '</div>' +
    '</div>' +
    '<div class="rpt-meta">' +
      '<div><div class="k">العميل</div><div class="v">' + esc(data.customer_name) + '</div></div>' +
      '<div><div class="k">الكود</div><div class="v">' + esc(data.customer_code || '') + '</div></div>' +
      '<div><div class="k">الجوال</div><div class="v" style="direction:ltr">' + esc(data.customer_phone || '—') + '</div></div>' +
      '<div><div class="k">المدينة / العنوان</div><div class="v">' + esc([data.customer_city, data.customer_address].filter(Boolean).join(' — ') || '—') + '</div></div>' +
    '</div>' +
    '<div class="rpt-kpis">' +
      '<div class="rpt-kpi"><div class="l">إجمالي المدين</div><div class="n">' + money(data.total_debit) + '</div></div>' +
      '<div class="rpt-kpi paid"><div class="l">إجمالي الدائن (محصّل)</div><div class="n">' + money(data.total_credit) + '</div></div>' +
      '<div class="rpt-kpi due"><div class="l">الرصيد المستحق</div><div class="n">' + money(due) + '</div></div>' +
      '<div class="rpt-kpi"><div class="l">بنود غير محصّلة</div><div class="n">' + (data.uncollected_ops || []).length + '</div></div>' +
    '</div>' +
    '<table class="stmt-tbl">' +
      '<thead><tr><th>التاريخ</th><th>النوع</th><th>البيان</th><th>مدين</th><th>دائن</th><th>الرصيد</th></tr></thead>' +
      '<tbody>' + rows + '</tbody>' +
      '<tfoot><tr>' +
        '<td colspan="3">الإجمالي</td>' +
        '<td class="num">' + money(data.total_debit) + '</td>' +
        '<td class="num">' + money(data.total_credit) + '</td>' +
        '<td class="num">' + money(due) + '</td>' +
      '</tr></tfoot>' +
    '</table>' +
    '<div class="rpt-foot">' +
      '<span>الرصيد المستحق = المدين − الدائن</span>' +
      '<span>مستند آلي من LiftCore</span>' +
    '</div>';

  document.getElementById('stmt-empty').style.display = 'none';
  document.getElementById('stmt-wrap').style.display = '';
  document.getElementById('btn-print').style.display = '';
  document.getElementById('toolbar-title').textContent =
    'كشف حساب — ' + (data.customer_name || '') + ' · مستحق ' + money(due);
  document.getElementById('link-revenues').href =
    '/revenues?customer_id=' + encodeURIComponent(data.customer_id);
}

async function loadStatement() {
  const id = document.getElementById('sel-client').value;
  if (!id) { alert('اختر العميل أولاً'); return; }
  const url = new URL(window.location.href);
  url.searchParams.set('customer_id', id);
  history.replaceState({}, '', url);
  try {
    const res = await fetch('/api/customers/' + id + '/statement', { credentials: 'same-origin' });
    if (!res.ok) throw new Error('failed');
    renderStatement(await res.json());
  } catch (e) {
    alert('تعذّر تحميل كشف الحساب');
  }
}

document.addEventListener('DOMContentLoaded', function () {
  if (PRESELECT) loadStatement();
});
</script>
</body>
</html>
