<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LiftCore — قريباً</title>
<meta name="robots" content="noindex">
<meta name="description" content="LiftCore — إدارة المصاعد أسهل وأذكى. قريباً.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Tajawal',sans-serif;
  background:#000;
  color:#e8eef8;
  min-height:100vh;
  min-height:100dvh;
  overflow:hidden;
}
.hero{
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:clamp(16px,3vh,32px);
  padding:clamp(16px,3vh,36px) clamp(12px,2vw,24px);
  background:#000;
}
.brand-logo{
  display:block;
  width:auto;
  height:auto;
  max-width:min(520px,86vw);
  max-height:min(120px,18vh);
  object-fit:contain;
  opacity:0;
  animation:fade .6s ease .05s forwards;
}
.hero-art{
  display:block;
  width:auto;
  height:auto;
  max-width:100%;
  max-height:min(72vh,72dvh);
  object-fit:contain;
  opacity:0;
  animation:fade .6s ease .15s forwards;
}
@keyframes fade{to{opacity:1}}
.login{
  position:fixed;
  z-index:2;
  bottom:max(16px,env(safe-area-inset-bottom));
  left:max(16px,env(safe-area-inset-left));
  color:#fff;
  text-decoration:none;
  font-weight:500;
  font-size:.9rem;
  padding:10px 18px;
  border-radius:999px;
  border:1px solid rgba(201,161,74,.45);
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(8px);
  transition:background .2s,border-color .2s;
}
.login:hover{
  background:rgba(201,161,74,.2);
  border-color:rgba(232,205,134,.8);
}
.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
}
@media (prefers-reduced-motion: reduce){
  .brand-logo,.hero-art{animation:none;opacity:1}
}
</style>
</head>
<body>
<h1 class="sr-only">LiftCore — قريباً · إدارة المصاعد أسهل وأذكى</h1>
<div class="hero">
  <img
    class="brand-logo"
    src="{{ url_for('static', filename='images/liftcore-header-logo.png') }}?v=10"
    alt="LiftCore — الإدارة الذكية للمصاعد"
    width="1024"
    height="320"
    decoding="async"
    fetchpriority="high"
  >
  <img
    class="hero-art"
    src="{{ url_for('static', filename='images/liftcore-coming-soon.png') }}?v=5"
    alt="LiftCore قريباً — منصة متكاملة لإدارة وتشغيل وصيانة المصاعد"
    width="1536"
    height="1024"
    decoding="async"
  >
</div>
<a class="login" href="{{ url_for('login') }}">دخول المنصة</a>
</body>
</html>
