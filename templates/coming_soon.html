<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LiftCore — قريباً</title>
<meta name="robots" content="noindex">
<meta name="description" content="LiftCore — إدارة المصاعد أسهل وأذكى. قريباً.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#020617;
  --text:#e8eef8;
  --muted:#8a9bb8;
  --accent:#2a7fff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Tajawal',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  overflow-x:hidden;
}
.hero{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:clamp(8px,2vw,20px);
  background:
    radial-gradient(ellipse 80% 60% at 50% 40%, rgba(42,127,255,.18), transparent 70%),
    var(--bg);
}
.hero-art{
  width:min(1280px,100%);
  height:auto;
  max-height:min(92vh,92dvh);
  object-fit:contain;
  display:block;
  border-radius:clamp(8px,1.2vw,16px);
  box-shadow:
    0 0 0 1px rgba(42,127,255,.18),
    0 24px 80px rgba(0,0,0,.55);
  opacity:0;
  transform:translateY(16px) scale(.985);
  animation:rise .9s cubic-bezier(.2,.8,.2,1) .15s forwards;
}
@keyframes rise{to{opacity:1;transform:none}}
.bar{
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:12px clamp(16px,3vw,28px);
  border-top:1px solid rgba(42,127,255,.16);
  background:rgba(2,6,23,.92);
  backdrop-filter:blur(8px);
  font-size:.85rem;
  color:var(--muted);
}
.bar a{
  color:#9ec1ff;
  text-decoration:none;
  font-weight:500;
  padding:8px 14px;
  border-radius:999px;
  border:1px solid rgba(42,127,255,.35);
  transition:background .2s,color .2s,border-color .2s;
}
.bar a:hover{
  color:#fff;
  background:rgba(42,127,255,.18);
  border-color:rgba(42,127,255,.55);
}
.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
}
@media (max-width:640px){
  .hero{padding:4px}
  .hero-art{max-height:none;width:100%;border-radius:0;box-shadow:none}
  .bar{flex-direction:column;text-align:center;padding:14px 16px 18px}
}
@media (prefers-reduced-motion: reduce){
  .hero-art{animation:none;opacity:1;transform:none}
}
</style>
</head>
<body>
<h1 class="sr-only">LiftCore — قريباً · إدارة المصاعد أسهل وأذكى</h1>
<div class="hero">
  <img
    class="hero-art"
    src="{{ url_for('static', filename='images/liftcore-coming-soon.png') }}?v=1"
    alt="LiftCore قريباً — منصة متكاملة لإدارة وتشغيل وصيانة المصاعد"
    width="1536"
    height="1024"
    decoding="async"
    fetchpriority="high"
  >
</div>
<footer class="bar">
  <span>www.liftcoreapp.com · مكة المكرمة · 2026</span>
  <a href="{{ url_for('login') }}">دخول المنصة</a>
</footer>
</body>
</html>
