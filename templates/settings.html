<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LiftCore — إعدادات الشركة</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0f17;--bg2:#111720;--bg3:#161e2b;--card:#131b27;
  --border:rgba(100,160,255,.1);--accent:#2a7fff;--gold:#c8a055;
  --text1:#e4eaf5;--text2:#8a9bb8;--text3:#4a5a72;--success:#1fb87a;
  --r:10px;--r-sm:7px;
}
body{font-family:'IBM Plex Sans Arabic',sans-serif;background:var(--bg);color:var(--text1);min-height:100vh;padding:24px}
.wrap{max-width:760px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
h1{font-size:20px;font-weight:600}
.back{color:var(--text2);text-decoration:none;font-size:13px}
.back:hover{color:var(--accent)}
.note{font-size:12px;color:var(--text3);background:rgba(42,127,255,.08);border:1px solid rgba(42,127,255,.15);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:18px;line-height:1.7}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:22px}
.section{font-size:13px;font-weight:600;color:var(--gold);margin:18px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.section:first-child{margin-top:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid .full{grid-column:1/-1}
label{display:block;font-size:11px;color:var(--text3);margin-bottom:6px}
input,textarea,select{
  width:100%;padding:10px 12px;background:var(--bg3);border:1px solid var(--border);
  border-radius:var(--r-sm);color:var(--text1);font-family:inherit;font-size:13px;
}
input:focus,textarea:focus{outline:none;border-color:var(--accent)}
.actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.btn{border:none;border-radius:var(--r-sm);padding:10px 18px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.btn-primary{background:var(--accent);color:#fff}
.btn-secondary{background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
.flash{background:rgba(31,184,122,.12);border:1px solid rgba(31,184,122,.25);color:var(--success);padding:10px 14px;border-radius:var(--r-sm);margin-bottom:14px;font-size:13px}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>إعدادات الشركة</h1>
    <a class="back" href="{{ url_for('contracts') }}">← العودة للعقود</a>
  </div>

  <div class="note">
    هذه البيانات تظهر تلقائياً في <strong>الطرف الأول</strong> عند طباعة عقود الصيانة (اسم الشركة، المقر، الهاتف، البريد، الممثل، الجوال).
  </div>

  {% if request.args.get('saved') %}
  <div class="flash">تم حفظ الإعدادات بنجاح.</div>
  {% endif %}

  <form class="card" method="post" action="{{ url_for('settings_save') }}">
    <div class="section">بيانات الشركة (الطرف الأول في العقود)</div>
    <div class="grid">
      <div class="full">
        <label>اسم الشركة *</label>
        <input name="company_name" required value="{{ settings.company_name or '' }}" placeholder="مثال: شركة تقنية جما التميز">
      </div>
      <div>
        <label>اسم الشركة (إنجليزي)</label>
        <input name="company_name_en" value="{{ settings.company_name_en or '' }}">
      </div>
      <div>
        <label>المدينة / المقر</label>
        <input name="city" value="{{ settings.city or '' }}" placeholder="مكة المكرمة">
      </div>
      <div class="full">
        <label>العنوان</label>
        <textarea name="address" rows="2">{{ settings.address or '' }}</textarea>
      </div>
      <div>
        <label>هاتف الشركة</label>
        <input name="phone" value="{{ settings.phone or '' }}" dir="ltr">
      </div>
      <div>
        <label>البريد الإلكتروني</label>
        <input name="email" type="email" value="{{ settings.email or '' }}" dir="ltr">
      </div>
      <div>
        <label>اسم الممثل (السيد/ ...)</label>
        <input name="rep_name" value="{{ settings.rep_name or '' }}" placeholder="ممثل الشركة في العقود">
      </div>
      <div>
        <label>جوال الممثل</label>
        <input name="rep_mobile" value="{{ settings.rep_mobile or '' }}" dir="ltr">
      </div>
      <div>
        <label>السجل التجاري</label>
        <input name="cr_number" value="{{ settings.cr_number or '' }}">
      </div>
      <div>
        <label>الرقم الضريبي</label>
        <input name="vat_number" value="{{ settings.vat_number or '' }}">
      </div>
      <div>
        <label>نسبة الضريبة %</label>
        <input name="tax_pct" type="number" step="0.01" value="{{ settings.tax_pct or 15 }}">
      </div>
      <div>
        <label>العملة</label>
        <input name="currency" value="{{ settings.currency or 'ر.س' }}">
      </div>
    </div>

    <div class="actions">
      <button type="submit" class="btn btn-primary">حفظ الإعدادات</button>
      <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">لوحة التحكم</a>
    </div>
  </form>
</div>
</body>
</html>
