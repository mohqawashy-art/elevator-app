<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ doc_title }} — {{ company.legal_name }}</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,Arial,'Traditional Arabic',sans-serif;background:#eef2f7;color:#1a3a5c;font-size:13px}
.toolbar{position:fixed;top:0;left:0;right:0;background:#1a2332;color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;z-index:9}
.toolbar a,.toolbar button{border:none;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;text-decoration:none;font-family:inherit}
.toolbar .print{background:#c9a14a;color:#111}
.toolbar .back{background:#334155;color:#fff}
.doc{width:210mm;max-width:210mm;min-height:277mm;margin:56px auto 24px;background:#fff;padding:22px 24px;box-shadow:0 8px 32px rgba(26,58,92,.12)}
.head{display:flex;justify-content:space-between;gap:16px;border-bottom:3px solid #1a3a5c;padding-bottom:14px;margin-bottom:16px}
.brand strong{display:block;font-size:18px}
.brand span{display:block;color:#6b7c93;font-size:12px;margin-top:4px}
.doc-type{text-align:left;direction:ltr}
.doc-type .t{font-size:22px;font-weight:800;color:#1a3a5c}
.doc-type .c{font-size:13px;margin-top:6px;letter-spacing:.04em}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;margin-bottom:18px}
.meta .k{font-size:11px;color:#6b7c93;font-weight:700}
.meta .v{font-size:13px;margin-top:2px}
table{width:100%;border-collapse:collapse;margin:8px 0 16px}
th,td{border:1px solid #d5dee8;padding:8px 10px;text-align:right}
th{background:#f4f7fb;font-size:11px}
.totals{width:280px;margin-right:auto}
.totals td{border:none;padding:5px 0}
.totals .sum{font-weight:800;border-top:2px solid #1a3a5c;padding-top:8px}
.note{font-size:12px;color:#6b7c93;line-height:1.7;margin-top:18px}
.foot{margin-top:28px;padding-top:12px;border-top:1px solid #d5dee8;font-size:11px;color:#6b7c93;text-align:center}
@media print{
  .toolbar{display:none!important}
  body{background:#fff}
  .doc{margin:0;box-shadow:none;width:100%;max-width:none}
  @page{size:A4;margin:10mm}
}
</style>
</head>
<body>
<div class="toolbar">
  <span>{{ doc_title }}</span>
  <span>
    <button class="print" type="button" onclick="window.print()">طباعة</button>
    <a class="back" href="{{ back_url }}">رجوع</a>
  </span>
</div>
<article class="doc">
  <header class="head">
    <div class="brand">
      <strong>{{ company.legal_name }}</strong>
      <span>{{ company.brand }} · {{ company.city }} · {{ company.phone }} · {{ company.email }}</span>
    </div>
    <div class="doc-type">
      <div class="t">{{ doc_title }}</div>
      <div class="c">{{ doc_code }}</div>
    </div>
  </header>
  {% block body %}{% endblock %}
  <div class="foot">{{ company.legal_name }} · منتج LiftCore · {{ company.country }}</div>
</article>
</body>
</html>
