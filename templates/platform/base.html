<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}LiftCore Platform{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
{% include 'partials/csrf_meta.html' %}
<style>
:root{
  --bg:#070b12;--panel:#0f1520;--card:#131b27;--line:rgba(120,160,220,.12);
  --text:#e8eef8;--muted:#7a8aa3;--accent:#3b82f6;--gold:#c8a055;
  --ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--r:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans Arabic',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{color:var(--accent);text-decoration:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 22px;border-bottom:1px solid var(--line);background:rgba(15,21,32,.92);position:sticky;top:0;z-index:20;backdrop-filter:blur(8px)}
.brand{font-weight:700;letter-spacing:.02em}
.brand span{color:var(--gold);font-weight:500;margin-right:8px;font-size:12px}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.nav a{padding:8px 12px;border-radius:8px;color:var(--muted);font-size:13px}
.nav a:hover,.nav a.on{background:rgba(59,130,246,.12);color:var(--text)}
.userbox{font-size:12px;color:var(--muted)}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 48px}
.h1{font-size:24px;font-weight:700;margin-bottom:6px}
.sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.flash{padding:10px 14px;border-radius:10px;margin-bottom:14px;font-size:13px;line-height:1.6}
.flash-ok{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.28);color:var(--ok)}
.flash-warn{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.28);color:var(--bad)}
.flash-info{background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.25);color:#93c5fd}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat .n{font-size:22px;font-weight:700}
.stat .l{font-size:11px;color:var(--muted);margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.section{font-size:13px;font-weight:600;color:var(--gold);margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th,.table td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px}
.badge-active{background:rgba(34,197,94,.15);color:var(--ok)}
.badge-trial{background:rgba(245,158,11,.15);color:var(--warn)}
.badge-suspended{background:rgba(239,68,68,.15);color:var(--bad)}
.badge-pending{background:rgba(59,130,246,.15);color:#93c5fd}
.badge-submitted{background:rgba(200,160,85,.15);color:var(--gold)}
.badge-activated{background:rgba(34,197,94,.15);color:var(--ok)}
.badge-cancelled,.badge-expired{background:rgba(239,68,68,.12);color:var(--bad)}
.btn{border:none;border-radius:8px;padding:9px 14px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--accent);color:#fff}
.btn-secondary{background:#182233;color:var(--text);border:1px solid var(--line)}
.btn-danger{background:rgba(239,68,68,.15);color:var(--bad);border:1px solid rgba(239,68,68,.3)}
.btn-sm{padding:6px 10px;font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .full{grid-column:1/-1}
label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}
input,select,textarea{width:100%;padding:10px 12px;background:#0c121c;border:1px solid var(--line);border-radius:8px;color:var(--text);font-family:inherit;font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.kv .k{font-size:11px;color:var(--muted);margin-bottom:2px}
.kv .v{font-size:13px;line-height:1.6;word-break:break-word}
code{background:#0c121c;padding:2px 7px;border-radius:4px;direction:ltr;display:inline-block}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:end}
.muted{color:var(--muted);font-size:12px}
@media(max-width:900px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.top{flex-direction:column;align-items:flex-start}}
</style>
{% block head %}{% endblock %}
</head>
<body>
<header class="top">
  <div class="brand">LiftCore <span>Platform Admin</span></div>
  <nav class="nav">
    <a href="{{ url_for('platform_home') }}" class="{% if nav == 'home' %}on{% endif %}">لوحة المنصة</a>
    <a href="{{ url_for('platform_orgs') }}" class="{% if nav == 'orgs' %}on{% endif %}">المؤسسات</a>
    <a href="{{ url_for('platform_invites') }}" class="{% if nav == 'invites' %}on{% endif %}">الدعوات</a>
    <a href="{{ url_for('operator_onboarding') }}">إنشاء دعوة</a>
  </nav>
  <div class="userbox">
    {% if auth_user %}{{ auth_user.full_name or auth_user.username }} · <a href="{{ url_for('logout') }}">خروج</a>{% endif %}
  </div>
</header>
<main class="wrap">
  {% if notice %}<div class="flash flash-{{ notice_type or 'info' }}">{{ notice }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
