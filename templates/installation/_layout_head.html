<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LiftCore — {{ page_title|default('مشاريع التركيب') }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0f17;--bg2:#111720;--bg3:#161e2b;--bg4:#1c2535;
  --card:#131b27;--border:rgba(100,160,255,.1);--border2:rgba(100,160,255,.2);
  --accent:#2a7fff;--gold:#c8a055;
  --text1:#e4eaf5;--text2:#8a9bb8;--text3:#4a5a72;
  --success:#1fb87a;--warning:#e09030;--danger:#e04848;
  --sidebar-w:240px;--header-h:60px;
  --font-ar:'IBM Plex Sans Arabic',sans-serif;--font-en:'DM Sans',sans-serif;
  --r:10px;--r-sm:7px;--trans:.18s ease;
}
html[dir="ltr"]{font-family:var(--font-en)}
html[dir="rtl"]{font-family:var(--font-ar)}
body{background:var(--bg);color:var(--text1);min-height:100vh;display:flex;overflow-x:hidden}
.sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;height:100vh;position:sticky;top:0;z-index:100}
html[dir="ltr"] .sidebar{border-left:none;border-right:1px solid var(--border)}
.sidebar-logo{padding:10px 16px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--border);min-height:var(--header-h)}
.sidebar-logo img{max-width:150px;height:auto;object-fit:contain}
.sidebar-nav{flex:1;overflow-y:auto;padding:10px 0}
.nav-section{padding:14px 16px 4px;font-size:10px;color:var(--text3);letter-spacing:.1em;font-weight:500}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 16px;margin:1px 8px;border-radius:var(--r-sm);cursor:pointer;transition:background .15s;font-size:13px;color:var(--text2);text-decoration:none}
.nav-item:hover{background:var(--bg3);color:var(--text1)}
.nav-item.active{background:rgba(42,127,255,.12);color:var(--accent)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.content{flex:1;padding:24px;overflow-y:auto}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.page-title{font-size:18px;font-weight:600}
.page-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-inline-start:auto}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:var(--r-sm);font-size:13px;font-weight:500;cursor:pointer;border:none;font-family:inherit;text-decoration:none}
.btn-primary{background:var(--accent);color:#fff}
.btn-secondary{background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
.btn-sm{padding:5px 10px;font-size:12px}
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:16px}
.panel-title{font-size:15px;font-weight:600;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
thead tr{background:var(--bg3);border-bottom:1px solid var(--border)}
th,td{padding:10px 12px;border-bottom:1px solid var(--border);text-align:right}
html[dir="ltr"] th,html[dir="ltr"] td{text-align:left}
th{color:var(--text3);font-size:11px}
tbody tr{transition:background-color .1s ease}
tbody tr:hover{background:var(--bg3)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--text2)}
.field input,.field select,.field textarea{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--text1);font-size:13px;padding:9px 12px;width:100%;font-family:inherit}
.badge{display:inline-flex;padding:3px 9px;border-radius:10px;font-size:11px;font-weight:500}
.badge-new{background:rgba(42,127,255,.12);color:var(--accent)}
.badge-warn{background:rgba(224,144,48,.12);color:var(--warning)}
.badge-ok{background:rgba(31,184,122,.12);color:var(--success)}
.badge-muted{background:rgba(138,155,184,.1);color:var(--text2)}
.flash{padding:10px 14px;border-radius:var(--r-sm);margin-bottom:12px;font-size:13px}
.flash-success{background:rgba(31,184,122,.12);color:var(--success);border:1px solid rgba(31,184,122,.2)}
.flash-error{background:rgba(224,72,72,.1);color:var(--danger);border:1px solid rgba(224,72,72,.2)}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px}
.stat-val{font-size:24px;font-weight:700;font-family:var(--font-en)}
.stat-label{font-size:11px;color:var(--text3);margin-top:4px}
@media(max-width:768px){.form-grid,.stat-grid{grid-template-columns:1fr}}
.mobile-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:95}
@media(max-width:768px){
  :root{--sidebar-w:260px}
  .sidebar{position:fixed;right:-260px;top:0;height:100vh;transition:right .25s ease;z-index:100}
  html[dir="ltr"] .sidebar{right:auto;left:-260px;transition:left .25s ease}
  .sidebar.open{right:0;box-shadow:-8px 0 32px rgba(0,0,0,.4)}
  html[dir="ltr"] .sidebar.open{left:0;right:auto;box-shadow:8px 0 32px rgba(0,0,0,.4)}
  .mobile-overlay.open{display:block}
}
</style>
