<style id="lc-critical-paint">html,body,html[data-theme],html[data-theme] body{background:#070a10;color:#f2f5fa;color-scheme:dark;min-height:100%}</style>
<script>
(function () {
  var theme = {% if splash_lock_theme|default(false) %}'premium'{% else %}{{ user_theme|tojson }}{% endif %};
  if (theme) document.documentElement.setAttribute('data-theme', theme);
  var lang = {{ user_language|default('ar')|tojson }};
  if (lang !== 'ar' && lang !== 'en') lang = 'ar';
  document.documentElement.setAttribute('lang', lang);
  document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
})();
</script>
