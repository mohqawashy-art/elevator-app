<style>
.att-wrap .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.att-wrap .stat-mini{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.att-wrap .stat-mini-val{font-size:22px;font-weight:600;color:var(--text1);font-family:var(--font-en)}
.att-wrap .stat-mini-label{font-size:11px;color:var(--text3)}
.att-wrap .table-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:auto}
.att-wrap table{width:100%;border-collapse:collapse;font-size:13px}
.att-wrap th,.att-wrap td{padding:10px 12px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}
.att-wrap th{color:var(--text3);font-size:11px;background:var(--bg2)}
.att-wrap td{color:var(--text2)}
.att-wrap .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:500}
.att-wrap .badge.ok{background:rgba(31,184,122,.12);color:var(--success)}
.att-wrap .badge.warn{background:rgba(224,144,48,.12);color:var(--warning)}
.att-wrap .badge.bad{background:rgba(224,72,72,.12);color:var(--danger)}
.att-wrap .badge.neutral{background:rgba(42,127,255,.12);color:var(--accent)}
.att-wrap .page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.att-wrap .page-title{font-size:18px;font-weight:600}
.att-wrap .filters-bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.att-wrap .filter-input,.att-wrap .filter-select{padding:8px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--text1);font-size:13px}
.att-wrap .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;align-items:center;justify-content:center;padding:20px}

.att-wrap .modal{background:var(--card);border:1px solid var(--border);border-radius:var(--r);width:min(560px,100%);max-height:90vh;overflow:auto;padding:20px}

.att-wrap .field{margin-bottom:12px}
.att-wrap .field label{display:block;font-size:12px;color:var(--text3);margin-bottom:4px}
.att-wrap .field input,.att-wrap .field select,.att-wrap .field textarea{width:100%;padding:8px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--text1)}
.att-wrap .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.att-wrap .setup-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:20px;font-size:13px;color:var(--text2);line-height:1.7}
.att-wrap .setup-box code{background:var(--bg3);padding:2px 6px;border-radius:4px;color:var(--accent)}
