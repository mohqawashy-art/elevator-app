<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0f17;--bg2:#111720;--bg3:#161e2b;--bg4:#1c2535;
  --card:#131b27;--border:rgba(100,160,255,.1);--border2:rgba(100,160,255,.2);
  --accent:#2a7fff;--gold:#c8a055;
  --text1:#e4eaf5;--text2:#8a9bb8;--text3:#4a5a72;
  --success:#1fb87a;--warning:#e09030;--danger:#e04848;--info:#2a9fff;
  --sidebar-w:240px;--header-h:60px;
  --font-ar:'IBM Plex Sans Arabic',sans-serif;--font-en:'DM Sans',sans-serif;
  --r:10px;--r-sm:7px;--trans:.18s ease;
}
html[dir="ltr"]{font-family:var(--font-en)}
html[dir="rtl"]{font-family:var(--font-ar)}
body{background:var(--bg);color:var(--text1);min-height:100vh;display:flex;overflow-x:hidden}
.sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;height:100vh;position:sticky;top:0;z-index:100;overflow:hidden}
html[dir="ltr"] .sidebar{border-left:none;border-right:1px solid var(--border)}
.sidebar-logo{padding:10px 16px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--border);min-height:var(--header-h)}
.sidebar-logo img{width:150px;height:44px;object-fit:contain}
.sidebar-nav{flex:1;overflow-y:auto;padding:10px 0}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.content{flex:1;padding:24px;overflow-y:auto}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.page-title{font-size:18px;font-weight:600;color:var(--text1)}
.page-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:var(--r-sm);font-size:13px;font-weight:500;cursor:pointer;transition:var(--trans);border:none;font-family:var(--font-ar);text-decoration:none}
html[dir="ltr"] .btn{font-family:var(--font-en)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#1e6fe8}
.btn-secondary{background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--bg4);color:var(--text1);border-color:var(--border2)}
.btn-sm{padding:5px 10px;font-size:12px}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat-mini{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;position:relative;overflow:hidden}
.stat-mini::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--sm-color,var(--accent));opacity:.6}
.stat-mini-val{font-size:22px;font-weight:600;color:var(--text1);font-family:var(--font-en);line-height:1;margin-bottom:3px}
.stat-mini-label{font-size:11px;color:var(--text3)}
.tabs{display:flex;gap:4px;margin-bottom:20px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:4px}
.tab{flex:1;padding:8px;text-align:center;font-size:13px;color:var(--text2);cursor:pointer;border-radius:var(--r-sm);transition:var(--trans);display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.tab.active{background:var(--bg4);color:var(--text1)}
.tab:hover:not(.active){background:var(--bg3);color:var(--text1)}
.filters-bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.filter-input,.filter-select{padding:8px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--text1);font-size:13px;font-family:var(--font-ar);outline:none}
.filter-input:focus,.filter-select:focus{border-color:var(--border2);box-shadow:0 0 0 3px rgba(42,127,255,.1)}
.info-panel{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:20px;font-size:13px;color:var(--text2);line-height:1.7}
.info-panel code{background:var(--bg3);padding:2px 6px;border-radius:4px;color:var(--accent);font-family:var(--font-en);font-size:12px}
.table-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead tr{background:var(--bg3);border-bottom:1px solid var(--border)}
thead th{padding:12px 14px;text-align:right;color:var(--text3);font-weight:500;font-size:11px;white-space:nowrap;letter-spacing:.04em}
html[dir="ltr"] thead th{text-align:left}
tbody tr{border-bottom:1px solid rgba(100,160,255,.05)}
tbody tr:last-child{border-bottom:none}
tbody td{padding:12px 14px;color:var(--text2);white-space:nowrap}
.td-code{font-family:var(--font-en);font-size:12px;color:var(--accent);font-weight:500}
.td-name{color:var(--text1);font-weight:500}
.td-actions{display:flex;gap:6px;align-items:center}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:10px;font-size:11px;font-weight:500;white-space:nowrap}
.badge::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.7}
.badge-available,.badge-green{background:rgba(31,184,122,.12);color:var(--success)}
.badge-busy,.badge-warning{background:rgba(224,144,48,.12);color:var(--warning)}
.badge-leave,.badge-blue{background:rgba(42,127,255,.12);color:var(--accent)}
.badge-inactive,.badge-gray{background:rgba(138,155,184,.1);color:var(--text2)}
.badge-no,.badge-red{background:rgba(224,72,72,.1);color:var(--danger)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .25s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);width:100%;max-width:720px;max-height:92vh;display:flex;flex-direction:column;transform:translateY(20px);transition:transform .25s}
.modal-overlay.open .modal{transform:translateY(0)}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.modal-title{font-size:15px;font-weight:600;color:var(--text1)}
.modal-close{width:30px;height:30px;border-radius:var(--r-sm);background:var(--bg3);border:1px solid var(--border);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--trans)}
.modal-close:hover{background:rgba(224,72,72,.15);color:var(--danger)}
.modal-close svg{width:14px;height:14px}
.modal-body{flex:1;overflow-y:auto;padding:22px}
.modal-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;flex-shrink:0}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:12px;font-weight:500;color:var(--text2)}
.field input,.field select,.field textarea{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--text1);font-size:13px;outline:none;transition:var(--trans);font-family:var(--font-ar);padding:9px 12px;width:100%}
html[dir="ltr"] .field input,html[dir="ltr"] .field select,html[dir="ltr"] .field textarea{font-family:var(--font-en)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--border2);box-shadow:0 0 0 3px rgba(42,127,255,.1)}
.field textarea{resize:vertical;min-height:70px}
.mobile-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:95}
@media(max-width:1100px){.stats-row{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){
  .sidebar{position:fixed;right:-240px;top:0;height:100vh;transition:right .25s ease}
  html[dir="ltr"] .sidebar{right:auto;left:-240px}
  .sidebar.open{right:0}
  html[dir="ltr"] .sidebar.open{left:0;right:auto}
  .mobile-overlay.open{display:block}
  .hamburger{display:flex}
  .content{padding:16px}
  .form-grid{grid-template-columns:1fr}
  .tabs{flex-direction:column}
}
</style>
