<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#f4f6fa;color:#1c2738;font-size:14px;padding:20px}
.toolbar{max-width:840px;margin:0 auto 12px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.btn{padding:8px 16px;border-radius:8px;border:1px solid #e3e8f0;background:#fff;cursor:pointer;font-size:13px;text-decoration:none;color:#0a2647}
.btn-primary{background:#0a2647;color:#fff;border-color:#0a2647}
.sheet{background:#fff;max-width:840px;margin:0 auto;padding:34px 40px;border-radius:10px}
.q-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #c9a14a;padding-bottom:16px;margin-bottom:16px;gap:16px}
.q-head .brand{display:flex;align-items:center;gap:14px;min-width:0}
.q-head .brand img{width:{{ logo_width_report or 150 }}px;max-height:72px;object-fit:contain;display:block}
.q-head .nm{font-size:20px;font-weight:800;color:#0a2647}
.q-head .sub{font-size:12px;color:#6b7a90;margin-top:4px;line-height:1.5}
.q-meta{text-align:left;font-size:12px;color:#6b7a90;flex-shrink:0;line-height:1.55}
.q-meta b{color:#0a2647}
.q-title{text-align:center;font-size:18px;font-weight:800;color:#0a2647;margin:12px 0}
.q-sec{margin-top:14px}
.q-sec h3{font-size:14px;font-weight:800;color:#0a2647;border-right:4px solid #c9a14a;padding-right:8px;margin-bottom:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#0a2647;color:#fff;padding:7px 9px;text-align:right;font-weight:600}
td{padding:7px 9px;border-bottom:1px solid #e3e8f0;vertical-align:top}
tr.stage td{background:#f3e8cf;font-weight:700;color:#0a2647}
.q-kv th{width:32%;background:#0a2647}
.q-kv td{background:#fff;color:#1c2738}
.q-scope-list{margin:0;padding-right:18px}
.q-scope-list li{margin:3px 0}
.totals{width:280px;margin-top:12px;margin-right:auto}
.totals .r{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed #e3e8f0;gap:12px}
.totals .g{background:#0a2647;color:#c9a14a;font-weight:800;padding:9px 12px;border-radius:8px;margin-top:6px;display:flex;justify-content:space-between;gap:12px}
.terms{font-size:12px;line-height:1.9;margin-top:12px}
.q-pay-list{margin:4px 0 8px}
.q-pay-list div{padding:1px 0}
.q-sign{display:flex;justify-content:space-between;margin-top:28px;font-size:12px;gap:24px}
.q-sign-box{position:relative;width:42%;height:110px;text-align:center}
.q-sign-line{position:absolute;right:0;left:0;bottom:0;border-top:1.5px solid #0a2647;padding-top:6px;font-weight:700;color:#0a2647}
.q-sign-box .q-company-seal{position:absolute;right:0;left:0;bottom:24px;display:flex;justify-content:center;align-items:flex-end;gap:0;margin:0;flex-wrap:nowrap;pointer-events:none}
.q-sign-box .q-company-seal .doc-seal-item{min-width:0}
.q-sign-box .q-company-seal .doc-seal-caption{display:none}
@media print{
  .toolbar{display:none!important}
  @page{size:A4 portrait;margin:0}
  html,body{
    background:#fff!important;
    width:210mm!important;
    max-width:210mm!important;
    min-width:210mm!important;
    padding:0!important;
    margin:0!important;
  }
  .sheet{
    border-radius:0!important;
    width:210mm!important;
    max-width:210mm!important;
    min-width:210mm!important;
    margin:0!important;
    padding:6mm 8mm!important;
    box-sizing:border-box!important;
    font-size:12px!important;
  }
  .q-head{padding-bottom:8px!important;margin-bottom:8px!important}
  .q-head .brand img{width:auto!important;max-width:160px!important;max-height:56px!important}
  .q-meta{font-size:11px!important}
  .q-title{font-size:16px!important;margin:8px 0 6px!important}
  .q-sec{margin-top:10px!important}
  .q-sec h3{font-size:12px!important;margin-bottom:6px!important}
  table{font-size:11px!important;width:100%!important}
  th,td{padding:5px 7px!important}
  .totals{width:42%!important;max-width:280px!important;font-size:12px!important;margin-top:10px!important}
  .totals .r{padding:4px 0!important}
  .totals .g{font-size:13px!important;padding:8px 10px!important}
  .terms{font-size:11px!important;line-height:1.65!important}
  .q-sign,.totals{page-break-inside:avoid}
}
</style>
