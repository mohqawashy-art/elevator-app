<script>
(function () {
  document.documentElement.setAttribute('data-theme', {{ user_theme|tojson }});
  var lang = {{ user_language|default('ar')|tojson }};
  if (lang !== 'ar' && lang !== 'en') lang = 'ar';
  document.documentElement.setAttribute('lang', lang);
  document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
  window.__LC_LANG = lang;
  document.documentElement.classList.add('lc-layout-topnav');
})();
</script>

<script>
(function () {
  if (!Number.prototype.__lcWesternPatched) {
    Number.prototype.__lcWesternPatched = true;
    var _n = Number.prototype.toLocaleString;
    Number.prototype.toLocaleString = function (locales, options) {
      return _n.call(this, 'en-US', options);
    };
  }
  if (window.setMoneyEl) return;
  function num(v, o) {
    o = o || {};
    var n = Number(v) || 0;
    return (window.fmtNum ? fmtNum(n, o) : n.toLocaleString('en-US', o));
  }
  var SAR = '\u20C1';
  window.moneySuffixHTML = function () {
    return ' <span class="lc-sar-char" aria-label="ريال سعودي">' + SAR + '</span>';
  };
  window.fmtMoney = function (v, o) {
    return '<span class="lc-money" dir="ltr">' + num(v, o) + moneySuffixHTML() + '</span>';
  };
  window.setMoneyEl = function (el, v, o) {
    if (el) el.innerHTML = fmtMoney(v, o);
  };
})();
</script>
