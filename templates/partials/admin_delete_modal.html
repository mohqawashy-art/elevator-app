<div class="modal-overlay" id="lc-admin-delete-modal" aria-hidden="true" style="z-index:9500!important">
  <div class="modal" style="max-width:420px">
    <div class="modal-head">
      <div class="modal-title" data-lc-delete-title style="color:var(--danger)">تأكيد الحذف</div>
      <button type="button" class="modal-close" data-lc-delete-cancel aria-label="إغلاق">
        <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="2" y1="2" x2="12" y2="12"/><line x1="12" y1="2" x2="2" y2="12"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <p data-lc-delete-message style="font-size:14px;color:var(--text2);line-height:1.65">هل أنت متأكد من الحذف؟</p>
      {% include 'partials/admin_delete_fields.html' %}
    </div>
    <div class="modal-foot">
      <button type="button" class="btn btn-secondary" data-lc-delete-cancel>إلغاء</button>
      <button type="button" class="btn btn-danger" data-lc-delete-confirm>حذف نهائي</button>
    </div>
  </div>
</div>
