<header class="header lc-header{% if header_solo %} lc-header--solo{% endif %}">
  <div class="lc-header-bar">
    <div class="lc-header-slot lc-header-slot--tenant">
      {% if header_solo %}
      <a class="lc-back-link" href="{{ url_for('dashboard') }}" data-i18n="back_dashboard">← لوحة التحكم</a>
      {% else %}
      <a class="lc-header-tenant-brand" href="{{ url_for('dashboard') }}" title="{{ brand_name|default('LiftCore') }}" aria-label="{{ brand_name|default('LiftCore') }}" data-i18n-skip>
        <img src="{{ brand_logo_url }}" alt="{{ brand_name|default('LiftCore') }}" class="lc-header-tenant-logo" data-i18n-skip>
      </a>
      {% endif %}
    </div>

    <a class="lc-header-slot lc-header-slot--center header-center-brand" href="{{ url_for('dashboard') }}" title="LiftCore" aria-label="LiftCore" dir="ltr" data-i18n-skip>
      <img src="{{ liftcore_logo_url }}?v=10" alt="LiftCore" class="lc-header-logo" data-i18n-skip
           onerror="if(!this.dataset.fb){this.dataset.fb='1';this.src='{{ url_for('static', filename='images/liftcore-brand-logo.png') }}?v=8';}">
    </a>

    <div class="lc-header-slot lc-header-slot--tools header-actions">
      <button type="button" class="hamburger" onclick="openSidebar()"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="3" y1="6" x2="17" y2="6"/><line x1="3" y1="10" x2="17" y2="10"/><line x1="3" y1="14" x2="17" y2="14"/></svg></button>
      <div class="profile-menu-wrap" onclick="event.stopPropagation()">
        <button type="button" class="lc-profile-btn" onclick="toggleProfileMenu(event)" title="{{ user_display_name or 'الحساب' }}">
          {% if user_avatar_url %}
          <img src="{{ user_avatar_url }}" alt="">
          {% else %}
          {{ user_initials }}
          {% endif %}
        </button>
        <div class="profile-dropdown" id="profile-dropdown">
          <div class="profile-dropdown-head">
            <div class="profile-dropdown-name">{{ user_display_name or 'مستخدم' }}</div>
            <div class="profile-dropdown-role">{{ user_role_label }}</div>
          </div>
          <a href="{{ url_for('settings', tab='account') }}" data-i18n="edit_profile">تعديل البروفايل</a>
          <a href="{{ url_for('settings', tab='appearance') }}" data-i18n="appearance">المظهر</a>
          <a href="{{ url_for('logout') }}" class="logout" data-i18n="logout">تسجيل الخروج</a>
        </div>
      </div>
      <a href="{{ url_for('settings') }}" class="icon-btn lc-settings-btn{% if request.endpoint == 'settings' %} is-active{% endif %}" data-i18n-title="settings" title="الإعدادات">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" width="16" height="16"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l-.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      </a>
      <button type="button" class="icon-btn lc-fullscreen-btn" id="btn-fullscreen" onclick="toggleFullscreen()" data-i18n-title="fullscreen" title="شاشة كاملة" aria-label="Full screen">
        <svg class="lc-fs-enter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" width="16" height="16"><path d="M8 3H5a2 2 0 00-2 2v3M16 3h3a2 2 0 012 2v3M8 21H5a2 2 0 01-2-2v-3M16 21h3a2 2 0 002-2v-3"/></svg>
        <svg class="lc-fs-exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" width="16" height="16" style="display:none"><path d="M9 9H5V5M15 9h4V5M9 15H5v4M15 15h4v4"/></svg>
      </button>
      <div class="lang-toggle" title="Language">
        <button type="button" class="lang-opt{% if user_language == 'ar' %} active{% endif %}" id="btn-ar" onclick="LiftCoreI18n.setLang('ar')" aria-label="العربية">ع</button>
        <button type="button" class="lang-opt{% if user_language == 'en' %} active{% endif %}" id="btn-en" onclick="LiftCoreI18n.setLang('en')" aria-label="English">EN</button>
      </div>
      <div class="lc-header-clock lc-digital-clock" id="lc-header-clock" aria-live="polite" data-i18n-skip>
        <div class="lc-digital-day" id="lc-header-weekday">—</div>
        <div class="lc-digital-main">
          <time class="lc-digital-time" id="lc-header-time-main" dir="ltr">00:00</time>
          <div class="lc-digital-side">
            <span class="lc-digital-ampm" id="lc-header-ampm">AM</span>
            <span class="lc-digital-secs" id="lc-header-seconds" dir="ltr">00</span>
          </div>
        </div>
        <div class="lc-digital-date" id="h-date" data-suffix=""></div>
      </div>
    </div>
  </div>
</header>
<script>
(function () {
  if (!window.matchMedia('(min-width: 1101px)').matches) return;
  var header = document.currentScript && document.currentScript.previousElementSibling;
  if (!header || !header.classList.contains('lc-header')) {
    header = document.querySelector('.main .lc-header, .main > header.header');
  }
  var sidebar = document.getElementById('sidebar');
  if (!header || !sidebar || header.dataset.lcShellMounted === '1') return;
  sidebar.parentNode.insertBefore(header, sidebar);
  header.dataset.lcShellMounted = '1';
  document.documentElement.classList.add('lc-shell-ready');
  document.documentElement.style.setProperty('--lc-header-h', '104px');
  if (window.applyHeaderHeight) window.applyHeaderHeight(header);
  else if (window.syncTopNavLayout) window.syncTopNavLayout();
})();
</script>
