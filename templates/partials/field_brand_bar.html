{# شعارات العميل + LiftCore — بوابة الفني (جوال) #}
<div class="fp-brand-bar" role="banner">
  <div class="fp-brand-slot fp-brand-slot--tenant">
    <img src="{{ brand_logo_url }}" alt="{{ brand_name|default('LiftCore') }}" class="fp-tenant-logo"
         onerror="if(!this.dataset.fb){this.dataset.fb='1';this.src='{{ url_for('static', filename='logo.png') }}';}">
  </div>
  <div class="fp-brand-slot fp-brand-slot--liftcore">
    <img src="{{ liftcore_logo_url }}?v=10" alt="LiftCore" class="fp-liftcore-logo" dir="ltr"
         onerror="if(!this.dataset.fb){this.dataset.fb='1';this.src='{{ url_for('static', filename='images/liftcore-brand-logo.png') }}?v=8';}">
  </div>
</div>
