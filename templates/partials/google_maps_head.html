<script>
  window.LIFTCORE_GOOGLE_MAPS_KEY = {{ google_maps_api_key|tojson }};
  window.__gmapsQueue = window.__gmapsQueue || [];
  function flushGmapsQueue() {
    var q = window.__gmapsQueue || [];
    window.__gmapsQueue = [];
    q.forEach(function (fn) { try { fn(); } catch (e) { console.error(e); } });
  }
  window.loadGmapsMarkerLib = function () {
    if (window.__gmapsMarkerReady) return Promise.resolve(window.__gmapsMarkerLib);
    if (window.__gmapsMarkerLoading) return window.__gmapsMarkerLoading;
    if (!window.google || !window.google.maps || !google.maps.importLibrary) {
      return Promise.reject(new Error('google maps not ready'));
    }
    window.__gmapsMarkerLoading = google.maps.importLibrary('marker').then(function (lib) {
      window.__gmapsMarkerLib = lib;
      window.__gmapsMarkerReady = true;
      if (window.LiftCoreMap && LiftCoreMap._setMarkerLib) LiftCoreMap._setMarkerLib(lib);
      return lib;
    });
    return window.__gmapsMarkerLoading;
  };
  window.liftcoreMapElHasGoogleError = function (el) {
    if (!el) return false;
    return !!el.querySelector('.gm-err-container, .gm-err-title, .gm-err-message');
  };
  window.liftcoreGoogleMapsUsable = function () {
    return !!(window.LIFTCORE_GOOGLE_MAPS_KEY && !window.__gmapsAuthFailed && window.google && window.google.maps);
  };
  window.liftcoreMapsFallbackReason = function () {
    if (!window.LIFTCORE_GOOGLE_MAPS_KEY) return 'no_key';
    if (window.__gmapsAuthFailed) return 'auth_failed';
    if (typeof google === 'undefined' || !google.maps) return 'loading';
    return '';
  };
  window.liftcoreNotifyMapPickerFallback = function () {
    if (window.LiftCoreMapPicker && window.LiftCoreMapPicker._lastOpts) {
      try {
        window.LiftCoreMapPicker.hardReset();
        window.LiftCoreMapPicker.init(window.LiftCoreMapPicker._lastOpts);
      } catch (e) { console.error(e); }
    }
  };
  window.whenGoogleMapsReady = function (fn) {
    if (!window.LIFTCORE_GOOGLE_MAPS_KEY || window.__gmapsAuthFailed) { fn(); return; }
    if (!window.google || !window.google.maps) {
      window.__gmapsQueue.push(fn);
      return;
    }
    fn();
  };
  window.initGoogleMapsApi = function () {
    flushGmapsQueue();
    window.loadGmapsMarkerLib().catch(function () {});
  };
  window.gm_authFailure = function () {
    window.__gmapsAuthFailed = true;
    window.liftcoreNotifyMapPickerFallback();
    if (typeof refreshContractMap === 'function') refreshContractMap(true);
    if (typeof refreshElevatorMap === 'function') refreshElevatorMap(true);
  };
</script>
{% if google_maps_api_key %}
<script async
  src="https://maps.googleapis.com/maps/api/js?key={{ google_maps_api_key }}&loading=async&language=ar&region=SA&libraries={{ gmaps_libraries|default('places,marker') }}&callback=initGoogleMapsApi"
  onerror="window.__gmapsAuthFailed=true;window.gm_authFailure&&window.gm_authFailure()"></script>
{% endif %}
