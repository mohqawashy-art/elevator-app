upstream liftcore_app {
    server 127.0.0.1:5001 fail_timeout=0;
}

# وصول بالـ IP على المنفذ 80 — لفحص /api/health قبل تحويل DNS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 20M;

    location / {
        proxy_pass http://liftcore_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

# أسماء النطاق — تحويل HTTP إلى HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name liftcoreapp.com www.liftcoreapp.com app.liftcoreapp.com jama.liftcoreapp.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name liftcoreapp.com www.liftcoreapp.com app.liftcoreapp.com jama.liftcoreapp.com;

    ssl_certificate     /etc/ssl/certs/liftcore-origin.crt;
    ssl_certificate_key /etc/ssl/private/liftcore-origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 20M;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://liftcore_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
