<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>LiftCore — بدون اتصال</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: #0b0f17;
      color: #e4eaf5;
      text-align: center;
    }
    .box {
      max-width: 420px;
      background: #131b27;
      border: 1px solid rgba(100, 160, 255, 0.18);
      border-radius: 14px;
      padding: 1.6rem 1.4rem;
    }
    h1 { font-size: 1.25rem; margin: 0 0 0.75rem; color: #e09030; }
    p { margin: 0 0 1rem; color: #8a9bb8; line-height: 1.7; font-size: 0.95rem; }
    a {
      display: inline-block;
      background: #2a7fff;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      border-radius: 10px;
      padding: 0.65rem 1.1rem;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>لا يوجد اتصال</h1>
    <p>
      هذه الصفحة غير محفوظة للعرض بدون إنترنت.
      افتح لوحة التحكم أو أي صفحة زرتها سابقاً أثناء الاتصال.
      النماذج التي تحفظها بدون نت تُوضع في طابور محلي وتُرفع تلقائياً عند عودة الشبكة (ما عدا المرفقات).
    </p>
    <a href="/dashboard">لوحة التحكم</a>
  </div>
</body>
</html>
